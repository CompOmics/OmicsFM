# ProtGPT Configuration
data:
  # Unified .h5ad source for both modalities (build with protgpt.convert).
  # Proteomics:     data/<variant>/{train,valid,test}.h5ad
  # Transcriptomics: transcriptomics/split/{train,valid,test}.h5ad
  train_path: data\flashlfq_diann\train.h5ad
  valid_path: data\flashlfq_diann\valid.h5ad
  test_path:  data\flashlfq_diann\test.h5ad

  num_bins: 10                 # expression bins (1-10, 0 = not detected)
  detect_groups: true          # collapse proteins with identical raw abundance into groups
                               #   (proteomics only; set false for transcriptomics)

# Transfer learning (optional)
transfer:
  checkpoint_path:  null         # path to pretrained checkpoint (.ckpt), null = train from scratch
  freeze_transformer: false      # freeze transformer layers initially
  freeze_epochs: 0               # unfreeze after N epochs (0 = never freeze)

device: cuda                   # e.g. cuda:0, cuda:1, cpu

model:
  d_model: 256                 # hidden dimension
  n_heads: 8                   # attention heads
  n_layers: 6                  # transformer blocks
  d_ff: 1024                   # feedforward inner dimension
  dropout: 0.1
  input_features: 1024         # max detected individual features per sample (subsample if more, pad if fewer)
  feature_context_ratio: 0.85  # fraction of individual features used as context
  
  use_esmc: true             # MUST be false for gene accessions (ESM-C only embeds protein/UniProt ids)
  fasta_path: fasta/human_proteome_canonical_31032022.fasta  # protein sequences for ESM-C
  esmc_model: esmc_600m        # ESM-C model variant (esmc_300m or esmc_600m)
  esmc_cache: data/esmc_human_cache.pt   # optional: pre-computed ESM-C embeddings (skips inference if present)

  # Optional absent proteins/genes modeling (both proteomics and transcriptomics)
  absent_species:              
    enabled: false               # true = add randomly sampled absent species to context
    input_absent: 50             # dedicated sequence slots for absent species
    absent_context_ratio: 0.50   # fraction as context (1.0 = all context, <1.0 = some become targets)
  
 # Optional protein group modeling (proteomics only)
  protein_groups:               
    enabled: false              # false = drop group proteins, only use individuals
    max_group_size: 20          # groups > this are dropped entirely
    input_groups: 256           # dedicated sequence slots for protein groups (0 = disable group segment)
    group_context_ratio: 0.2    # fraction of groups as context (1.0 = all context, no group targets)
    encoder: "mean"             # "attention" or "mean"
    attention:
      n_heads: 4
      n_encoder_layers: 1

training:
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 1.0e-5
  max_epochs: 200
  val_frequency: 1               # how often to validate (0.1 = every 10% of epoch)
  early_stopping_patience: 5000    # epochs without improvement before stopping
  early_stopping_delta: 0.001      # minimum improvement to count
  gradient_clip: 1.0
  num_workers: 0

output:
  save_dir: model                               # directory for checkpoints and logs
  experiment_name: prot_flashlfq_diann_esmc     # subdirectory for this run