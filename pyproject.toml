[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omicsfm"
version = "0.1.0"
description = "OmicsFM: a foundation model over paired proteomic and transcriptomic expression"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sander Heyndrickx" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Core runtime: loading a checkpoint, running inference, extracting attention
# and fetching artifacts. Everything imported at module level by api, attention,
# data or convert belongs here, so `import omicsfm.api` works on a bare install.
# Versions are deliberately open; environment.lock.yml records what was run.
dependencies = [
    "anndata",
    "h5py",
    "huggingface_hub",   # omicsfm.hub, artifact download
    "numpy",
    "pandas",
    "psutil",            # omicsfm.data, memory accounting
    "pyyaml",            # module-level in omicsfm.api
    "scikit-learn",      # module-level in omicsfm.api
    "scipy",
    "torch",
    "tqdm",
]

[project.optional-dependencies]
# omicsfm.train
train = ["wandb"]
# omicsfm.esmc_utils - ESM-C protein sequence embeddings
esmc = ["esm", "biopython"]
# interactive plots in omicsfm.api / omicsfm.attention (imported lazily)
viz = ["plotly", "umap-learn"]
# running setup.ipynb and the figure notebooks
notebook = ["ipykernel", "ipywidgets", "matplotlib"]
all = ["omicsfm[train,esmc,viz,notebook]"]

[tool.setuptools]
# Source-only package. Ground-truth matrices and checkpoints are data, not
# package contents; they live under data/ and model/ at the repository root.
packages = ["omicsfm"]

[tool.setuptools.package-data]
omicsfm = []
