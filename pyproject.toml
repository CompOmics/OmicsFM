[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omicsfm"
version = "0.1.0"
description = "OmicsFM: a foundation model over paired proteomic and transcriptomic expression"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sander Heyndrickx" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Core runtime: loading a checkpoint, running inference, extracting attention
# and fetching artifacts. Everything imported at module level by api, attention,
# data belongs here, so `import omicsfm.api` works on a bare install.
# Versions are deliberately open; envs/environment.lock.yml records what was run.
dependencies = [
    "anndata",
    "h5py",
    "huggingface_hub",   # omicsfm.hub, artifact download
    "numpy",
    "pandas",
    "psutil",            # omicsfm.data, memory accounting
    "pyyaml",            # module-level in omicsfm.api
    "scikit-learn",      # module-level in omicsfm.api
    "scipy",
    "torch",
    "tqdm",
]

[project.scripts]
omicsfm = "omicsfm._cli:main"

[project.optional-dependencies]
# omicsfm.train
train = ["wandb"]
# omicsfm.esmc_utils - ESM-C protein sequence embeddings
esmc = ["esm", "biopython"]
# interactive plots in omicsfm.api / omicsfm.attention (imported lazily)
viz = ["plotly", "umap-learn"]
# running the notebooks. nbformat is required by plotly's fig.show(): without
# it, visualize_sst raises "Mime type rendering requires nbformat" only at the
# point of display, after the embedding work is already done.
notebook = ["ipykernel", "ipywidgets", "matplotlib", "nbformat"]
# reference/notebooks/ - rebuilding the ground-truth matrices and the
# identifier crosswalk from source. pyarrow is what reads and writes
# reference/gene_protein_map.parquet; without it pandas has no parquet engine.
reference = ["mygene", "omnipath", "pyarrow", "requests"]
# transcriptomics/ - building the expression datasets from primary sources.
# Heavy (tiledbsoma, cellxgene-census), so deliberately not part of a default
# install; only needed to regenerate the datasets rather than to use them.
datasets = [
    "archs4py",
    "cellxgene-census",
    "mygene",
    "pyarrow",          # pandas parquet I/O
    "requests",
    "tiledbsoma",
]
all = ["omicsfm[train,esmc,viz,notebook,reference]"]
# Everything including the dataset-construction stack.
full = ["omicsfm[all,datasets]"]

# transcriptomics/bulk/normalize_metadata.py optionally uses agentic_metadata,
# a separate project imported lazily inside the functions that need it. It is
# not declared here because it is not published and not required to run OmicsFM.

[tool.setuptools]
# Source-only package. Ground-truth matrices and checkpoints are data, not
# package contents; they live under data/ and model/ at the repository root.
packages = ["omicsfm"]

[tool.setuptools.package-data]
omicsfm = []
