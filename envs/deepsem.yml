# deepsem — DeepSEM baseline
#
# Generated from the working Windows environment. Conda provides only
# python and pip; everything else is pinned through pip so the file
# resolves on Linux as well. Recreate with:
#     conda env create -f envs/deepsem.yml
#
name: deepsem
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.20
  - pip
  # torch is a cu128 build; the index below serves those wheels.
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - anndata==0.11.4
      - array-api-compat==1.15.0
      - asttokens==3.0.1
      - comm==0.2.3
      - contourpy==1.3.2
      - cycler==0.12.1
      - debugpy==1.8.21
      - decorator==5.3.1
      - exceptiongroup==1.3.1
      - executing==2.2.1
      - filelock==3.29.0
      - fonttools==4.63.0
      - fsspec==2026.4.0
      - h5py==3.16.0
      - ipykernel==7.3.0
      - ipython==8.39.0
      - jedi==0.20.0
      - Jinja2==3.1.6
      - joblib==1.5.3
      - jupyter_client==8.9.1
      - jupyter_core==5.9.1
      - kiwisolver==1.5.0
      - MarkupSafe==3.0.3
      - matplotlib-inline==0.2.2
      - matplotlib==3.10.9
      - mpmath==1.3.0
      - natsort==8.4.0
      - nest-asyncio2==1.7.2
      - networkx==3.4.2
      - numpy==2.2.6
      - packaging==26.0
      - pandas==2.3.3
      - parso==0.8.7
      - pillow==12.2.0
      - platformdirs==4.10.0
      - prompt_toolkit==3.0.52
      - psutil==7.2.2
