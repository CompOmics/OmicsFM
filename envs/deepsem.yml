      - Pygments==2.20.0
      - pyparsing==3.3.2
      - python-dateutil==2.9.0.post0
      - pytz==2026.2
      - pyzmq==27.1.0
      - scikit-learn==1.7.2
      - scipy==1.15.3
      - six==1.17.0
      - stack-data==0.6.3
      - sympy==1.14.0
      - threadpoolctl==3.6.0
