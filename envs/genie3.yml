# genie3 — GENIE3 baseline
#
# Generated from the working Windows environment. Conda provides only
# python and pip; everything else is pinned through pip so the file
# resolves on Linux as well. Recreate with:
#     conda env create -f envs/genie3.yml
#
name: genie3
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.20
  - pip
  - pip:
      - anndata==0.11.4
      - arboreto==0.1.6
