# Environment for running OmicsFM itself. Each experiment ships its own
# environment file; this one covers the package only.
#
#     conda env create -f envs/environment.yml
#     conda activate omicsfm
#
# The editable path below is ".." because conda resolves relative paths in the
# pip section against this file's directory, not the working directory. From
# envs/, ".." is the repository root, where pyproject.toml lives.
#
# Works unchanged on Windows and Linux: conda supplies only Python and pip, and
# pip resolves platform-appropriate wheels. Dependencies come from
# pyproject.toml rather than being duplicated here, so there is one source of
# truth and no second file to drift out of sync.
#
# Versions float. For the exact stack a published result was produced with, see
# envs/environment.lock.yml.
#
# CUDA: torch is pinned to a +cu128 build, matching the hardware the models were
# trained on. The pin is required, not cosmetic: --extra-index-url only adds the
# CUDA index alongside PyPI, and pip then picks whichever version is highest,
# which is the CPU-only wheel. Naming the +cu128 local version forces the CUDA
# build, since PyPI carries no such variant.
#
# For a different CUDA version change both the URL and the pin; for CPU-only,
# drop the torch line and the index URL entirely.
name: omicsfm
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.10.0+cu128
      - --editable ..[all]
