# scGPT — scGPT comparator
#
# Generated from the working Windows environment. Conda provides only
# python and pip; everything else is pinned through pip so the file
# resolves on Linux as well. Recreate with:
#     conda env create -f envs/scGPT.yml
#
name: scGPT
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.20
  - pip
  # torch is a cu128 build; the index below serves those wheels.
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - anndata==0.11.4
      - array-api-compat==1.14.0
      - asttokens==3.0.1
      - beautifulsoup4==4.14.3
