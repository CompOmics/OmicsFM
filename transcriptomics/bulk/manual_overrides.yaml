# ─────────────────────────────────────────────────────────────────────────────
# Manual metadata overrides for bulk harmonization.
#
# Edit this file freely, then re-run:
#     python transcriptomics/bulk/normalize_metadata.py --config transcriptomics/bulk/pipeline_config.yaml --expression <h5ad>
#     (or --preview N to see the effect on the QC map without touching the h5ad)
#
# How it works:
#   - Format:  <field>:  "<raw value>": <forced canonical term>
#   - The raw value is matched case-INSENSITIVELY against the value extracted for that
#     field (from the characteristics key, or the source_name fallback for tissue).
#   - Applied BEFORE SapBERT, so it works for BOTH wrong mappings and unmapped values.
#   - Surgical: only the EXACT strings listed here are affected. Variants (e.g.
#     "whole peripheral blood") are NOT caught — add them explicitly or grow the vocab.
#   - Recorded in normalization_map.tsv with status = "override" (auditable).
#
# NOTE: overrides are exact-match, so they cover the head of the distribution. For broad
# coverage of spelling/wording variants, growing the vocabularies in
# ../../agentic-metadata/agentic_metadata/ontologies/ is more effective.
# ─────────────────────────────────────────────────────────────────────────────

tissue:
  # --- blood family (fix the "blood plasma" attractor for exact strings) ---
  peripheral blood: blood              # was -> "blood plasma" (~12k samples)
  peripheral blood leukocytes: blood   # was -> "lymphocytes" (over-specific)
  whole blood: blood
  cord blood: blood                    # was -> "umbilical cord"
  # --- threshold-misses: real tissues that fell just under the SapBERT cutoff ---
  pancreatic islets: pancreas          # was unmapped (0.684)
  healthy skin: skin                   # was unmapped (0.661)
  non-lesional skin: skin
  psoriasis lesion: skin               # a skin sample (the disease goes to the disease field)
  ipsc-cardiomyocytes: heart           # iPSC-derived cardiomyocytes
  hipsc-cm: heart
  icell neurons: brain                 # iPSC-derived neurons
  # --- mistakes: mapped to a wrong/over-specific term ---
  nasal epithelium: nasal epithelium   # was -> "olfactory epithelium" (a different, specialized tissue)
  hematopoietic: bone marrow           # was -> "stem cells" (vague)

disease:
  # --- healthy / control synonyms (-> healthy) ---
  control: healthy
  hc: healthy                          # healthy control
  ctrl: healthy
  wild-type control: healthy
  ngt: healthy                         # normal glucose tolerance
  # --- common diseases missing from diseases.txt (full canonical names) ---
  psoriasis: psoriasis
  atopic dermatitis: atopic dermatitis
  copd: chronic obstructive pulmonary disease
  asthma: asthma
  sepsis: sepsis
  schizophrenia: schizophrenia
  major depressive disorder: major depressive disorder
  major depressive disorder (mdd): major depressive disorder
  mdd: major depressive disorder
  multiple sclerosis: multiple sclerosis
  multiple sclerosis (ms): multiple sclerosis
  ms: multiple sclerosis
  ipf: idiopathic pulmonary fibrosis
  cutaneous t-cell lymphoma: cutaneous T-cell lymphoma
  mds: myelodysplastic syndrome
  hgsoc: ovarian cancer                # high-grade serous ovarian carcinoma
  early-stage her2-positive breast cancer: breast cancer
  # --- disease abbreviations (applied only to disease-key values, so context is disease) ---
  cd: Crohn's disease
  tb: tuberculosis
  tb subjects: tuberculosis
  psa: psoriatic arthritis
  pd: Parkinson's disease
  covid positive: COVID-19
  # Skipped intentionally (ambiguous / not a disease): ND, CTL (a T-cell type),
  # bare "Disease"/"Tumor"/"Biopsy". Add here if you decide on a mapping.
